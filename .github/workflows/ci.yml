name: Testes dos laboratórios

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar scripts Python
        run: |
          python -m compileall -q lab scripts
      - name: Rodar testes de laboratório
        run: bash scripts/testar-tudo.sh
      - name: Checagem heurística de segredos
        run: python scripts/revisar-arquivos.py
